          cat > app/src/main/java/com/fpvpult/TouchpadView.kt <<'EOF_FILE'
          package com.fpvpult

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.util.AttributeSet
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.abs

          /** Тачпад: 1 палец — движение, тап — клик, 2 пальца — прокрутка. */
          class TouchpadView @JvmOverloads constructor(
              context: Context, attrs: AttributeSet? = null
          ) : View(context, attrs) {

              var onMove: ((Float, Float) -> Unit)? = null
              var onTap: (() -> Unit)? = null
              var onScroll: ((Int) -> Unit)? = null

              private var lastX = 0f; private var lastY = 0f
              private var downT = 0L; private var moved = 0f
              private var maxP = 0; private var scrollAcc = 0f

              private val bg = Paint().apply { color = 0xFF1B232C.toInt() }
              private val txt = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xFF55657A.toInt(); textAlign = Paint.Align.CENTER; textSize = 40f
              }

              override fun onDraw(c: Canvas) {
                  c.drawRect(0f, 0f, width.toFloat(), height.toFloat(), bg)
                  c.drawText("ТАЧПАД", width / 2f, height / 2f, txt)
              }

              private fun avgX(e: MotionEvent, skip: Int): Float {
                  var s = 0f; var n = 0
                  for (i in 0 until e.pointerCount) { if (i == skip) continue; s += e.getX(i); n++ }
                  return s / n
              }
              private fun avgY(e: MotionEvent, skip: Int): Float {
                  var s = 0f; var n = 0
                  for (i in 0 until e.pointerCount) { if (i == skip) continue; s += e.getY(i); n++ }
                  return s / n
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          lastX = e.x; lastY = e.y; downT = e.eventTime
                          moved = 0f; maxP = 1; scrollAcc = 0f
                      }
                      MotionEvent.ACTION_POINTER_DOWN -> {
                          maxP = maxOf(maxP, e.pointerCount)
                          lastX = avgX(e, -1); lastY = avgY(e, -1)
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val ax = avgX(e, -1); val ay = avgY(e, -1)
                          val dx = ax - lastX; val dy = ay - lastY
                          lastX = ax; lastY = ay
                          moved += abs(dx) + abs(dy)
                          if (e.pointerCount >= 2) {
                              scrollAcc += dy
                              if (abs(scrollAcc) > 30f) {
                                  onScroll?.invoke(if (scrollAcc > 0) 1 else -1)
                                  scrollAcc = 0f
                              }
                          } else onMove?.invoke(dx, dy)
                      }
                      MotionEvent.ACTION_POINTER_UP -> {
                          val skip = e.actionIndex
                          lastX = avgX(e, skip); lastY = avgY(e, skip)
                      }
                      MotionEvent.ACTION_UP -> {
                          if (maxP == 1 && moved < 20f && e.eventTime - downT < 250) onTap?.invoke()
                      }
                  }
                  return true
              }
          }
          EOF_FILE
